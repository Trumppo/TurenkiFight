# TurenkiFight shared agent task queue
# This file coordinates work; it does NOT automatically launch agents.
schema_version: 1
project: Trumppo/TurenkiFight
coordination:
  planning_owner: planning-session
  default_base: main
  claim_policy: "A worker must explicitly claim an assigned task before starting. Session labels are roles, not automatically discoverable session IDs."
  update_policy: "Update task state via PR or an explicitly authorized commit; avoid simultaneous edits to this file."
  merge_policy: "Never merge a PR without user approval."
  statuses: [backlog, ready, claimed, in_progress, review, blocked, done]
  work_package_policy: "Prefer one PR per coherent work package (normally 2-5 related tasks), multiple commits on one branch; avoid PRs for individual fixes or interim task metadata. Never batch unrelated changes."
  pr_body_policy: "Keep Task: <primary-task-id> for existing PR tracking; list additional tasks in the description until multi-task tracking is implemented."
  ci_policy: "Run focused local checks during development; full required CI on PR. Never bypass mandatory checks or owner merge approval."
# Optional work packages supplement existing task IDs; do not migrate historical tasks.
# Legacy task validation and PR tracking still use tasks: and one primary Task: ID.
work_packages:
  - id: WP-M2-BENCHMARK-VALIDATION
    title: Benchmark correctness and independent evidence
    assigned_role: tester-session
    status: done
    task_ids: [M2-BENCHMARK-HARNESS-IMPLEMENTATION]
    depends_on: [M2-BENCHMARK-HARNESS-IMPLEMENTATION]
    branch: tester/wp-m2-benchmark-validation
    pr_policy: one_pr_per_package
    acceptance:
      - Validate reproducible 7200-tick fixtures and fingerprints after implementation merge
      - Report negative-test coverage and NOT_MEASURED limitations
      - Publish independently reproducible evidence without network performance claims
    notes: "Implementation merged as b3b0166 after independent Tester PASS. Package is ready for Tester to claim; do not treat it as an automatic claim."

