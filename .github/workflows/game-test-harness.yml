name: Game Test Harness

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  game-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run full game harness
        run: npx playwright test tests/browser/harness.spec.ts
      - name: Upload HTML report, screenshots, traces and failure videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-harness-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
