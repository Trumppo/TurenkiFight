name: Agent task validation
on:
  push:
    paths:
      - '.github/AGENT_TASKS.yaml'
      - 'scripts/validate_agent_tasks.py'
      - '.github/workflows/agent-tasks.yml'
  pull_request:
    paths:
      - '.github/AGENT_TASKS.yaml'
      - 'scripts/validate_agent_tasks.py'
      - '.github/workflows/agent-tasks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate agent task queue
        run: python scripts/validate_agent_tasks.py
