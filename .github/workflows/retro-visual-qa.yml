name: M1.5 retro prototype visual QA
on:
  pull_request:
    paths:
      - 'src/game/presentation/**'
      - 'public/assets/station/**'
      - 'tests/browser/retro.spec.ts'
      - '.github/workflows/retro-visual-qa.yml'
  workflow_dispatch:
jobs:
  retro-visual-qa:
    runs-on: ubuntu-latest
    env:
      VITE_VISUAL_STYLE: retro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:browser
      - name: Capture expanded 48x64 P1 experiment
        run: npm run test:browser -- tests/browser/retro.spec.ts
        env:
          VITE_VISUAL_STYLE: retro
          VITE_FIGHTER_CANVAS: expanded
      - name: Capture original M1 comparison screenshots
        run: npm run test:browser -- tests/browser/retro.spec.ts
        env:
          VITE_VISUAL_STYLE: classic
      - name: Upload retro comparison screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m1-5-retro-screenshots
          path: artifacts/visual/
          if-no-files-found: warn
