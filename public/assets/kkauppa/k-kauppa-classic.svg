<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180" shape-rendering="crispEdges">
  <!-- Original Finnish corner-shop interior, drawn in the project's 320x180 art grid. -->
  <rect width="320" height="180" fill="#747b78"/>
  <!-- Quiet upper wall and a broad, high window band. -->
  <rect width="320" height="33" fill="#596b70"/>
  <rect x="14" y="7" width="292" height="24" fill="#26383e"/>
  <rect x="18" y="10" width="284" height="17" fill="#9bb6b6"/>
  <rect x="18" y="21" width="284" height="6" fill="#718f92"/>
  <g fill="#d0c29d" opacity=".72"><rect x="37" y="11" width="20" height="2"/><rect x="93" y="13" width="16" height="2"/><rect x="217" y="12" width="26" height="2"/><rect x="264" y="14" width="22" height="2"/></g>
  <path d="M0 33H320V44H0Z" fill="#d2cbb8"/>
  <rect x="0" y="40" width="320" height="68" fill="#d5cfbd"/>
  <rect x="0" y="42" width="320" height="3" fill="#eee3ca"/>
  <g fill="#b8b4a7"><rect x="26" y="48" width="4" height="52"/><rect x="190" y="48" width="4" height="52"/><rect x="221" y="48" width="4" height="52"/></g>
  <!-- Back-wall grocery shelving: quiet package colors and wide clear shelf faces. -->
  <g>
    <rect x="17" y="53" width="176" height="48" fill="#655a4e"/>
    <rect x="20" y="56" width="170" height="41" fill="#a29a84"/>
    <rect x="20" y="72" width="170" height="3" fill="#62584c"/>
    <rect x="20" y="87" width="170" height="3" fill="#62584c"/>
    <rect x="20" y="96" width="170" height="5" fill="#554d45"/>
    <g fill="#c39a67"><rect x="27" y="60" width="10" height="10"/><rect x="55" y="59" width="12" height="11"/><rect x="89" y="60" width="11" height="10"/><rect x="119" y="58" width="13" height="12"/><rect x="160" y="60" width="12" height="10"/></g>
    <g fill="#75908a"><rect x="41" y="61" width="9" height="9"/><rect x="74" y="59" width="10" height="11"/><rect x="105" y="61" width="9" height="9"/><rect x="139" y="60" width="12" height="10"/><rect x="176" y="61" width="9" height="9"/></g>
    <g fill="#b86e58"><rect x="29" y="77" width="11" height="8"/><rect x="62" y="77" width="12" height="8"/><rect x="96" y="77" width="10" height="8"/><rect x="130" y="77" width="12" height="8"/><rect x="164" y="77" width="12" height="8"/></g>
    <g fill="#d5c9a9"><rect x="45" y="78" width="11" height="7"/><rect x="79" y="78" width="12" height="7"/><rect x="113" y="78" width="12" height="7"/><rect x="147" y="78" width="12" height="7"/><rect x="178" y="78" width="7" height="7"/></g>
  </g>
  <!-- Chilled drinks fridge with a low-contrast glass door and readable bottles. -->
  <g>
    <rect x="230" y="43" width="70" height="67" fill="#364b50"/>
    <rect x="234" y="47" width="62" height="59" fill="#8fa3a0"/>
    <rect x="239" y="51" width="50" height="51" fill="#b0c3bc"/>
    <rect x="241" y="68" width="46" height="2" fill="#667c79"/>
    <rect x="241" y="84" width="46" height="2" fill="#667c79"/>
    <rect x="291" y="52" width="2" height="48" fill="#52666a"/>
    <g stroke="#4b635b" stroke-width="1"><path d="M247 55h5v10h-5z" fill="#78a37e"/><path d="M258 54h5v11h-5z" fill="#c89455"/><path d="M271 56h5v9h-5z" fill="#758da1"/><path d="M281 54h5v11h-5z" fill="#b97662"/><path d="M248 72h5v10h-5z" fill="#c89455"/><path d="M261 72h5v10h-5z" fill="#78a37e"/><path d="M274 72h5v10h-5z" fill="#c17b62"/><path d="M249 89h5v10h-5z" fill="#758da1"/><path d="M263 89h5v10h-5z" fill="#c89455"/><path d="M277 89h5v10h-5z" fill="#78a37e"/></g>
  </g>
  <!-- Plain fictional K-kauppa fascia; no imported logo or commercial artwork. -->
  <rect x="100" y="35" width="112" height="12" fill="#39484b"/>
  <rect x="103" y="37" width="106" height="8" fill="#e2dbc8"/>
  <text x="156" y="43.5" text-anchor="middle" font-family="monospace" font-size="7" font-weight="bold" letter-spacing="1" fill="#586d6e">K-KAUPPA</text>
  <!-- Low counter and checkout are tucked at the back edge of the fighting plane. -->
  <rect x="33" y="102" width="147" height="12" fill="#604d42"/>
  <rect x="36" y="104" width="141" height="5" fill="#b49772"/>
  <rect x="39" y="114" width="7" height="10" fill="#746251"/><rect x="167" y="114" width="7" height="10" fill="#746251"/>
  <rect x="139" y="97" width="20" height="7" fill="#323f40"/><rect x="142" y="99" width="14" height="3" fill="#b4c1b0"/>
  <rect x="113" y="99" width="12" height="3" fill="#b96e58"/>
  <!-- Calm tiled floor: only broad low-contrast seams, leaving the central arena quiet. -->
  <rect y="124" width="320" height="56" fill="#7d8580"/>
  <rect y="124" width="320" height="3" fill="#656f6d"/>
  <g stroke="#707a76" stroke-width="1" opacity=".75"><path d="M0 145H320M0 163H320M0 179H320"/><path d="M40 127v53m40-53v53m40-53v53m40-53v53m40-53v53m40-53v53m40-53v53m40-53v53"/></g>
  <g stroke="#90958c" stroke-width="1" opacity=".45"><path d="M0 136H320M0 154H320m0 18H0"/></g>
